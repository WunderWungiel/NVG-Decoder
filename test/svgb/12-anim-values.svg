<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="200" height="200" viewBox="0 0 200 200">
  <rect x="0" y="0" width="10" height="10">
    <animate attributeName="x" values="10;50;100" dur="2s"/>
    <animate attributeName="x" values="10;50;100" keyTimes="0;0.25;1" dur="2s"/>
    <animate attributeName="x" values="10;50;100" keyTimes="0;0.5;1" calcMode="discrete" dur="2s"/>
    <animate attributeName="x" values="10;50;100" calcMode="paced" dur="2s"/>
    <animate attributeName="x" values="10;100" keyTimes="0;1" keySplines="0.5 0 0.5 1" calcMode="spline" dur="2s"/>
    <animate attributeName="x" values="10;50;100" keyTimes="0;0.5;1" keySplines="0 0 1 1;0.25 0.1 0.25 1" calcMode="spline" dur="2s"/>
    <animateColor attributeName="fill" values="#ff0000;#00ff00;#0000ff" dur="2s"/>
  </rect>
</svg>
