<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="200" height="200" viewBox="0 0 200 200">
  <path id="track" d="M10 150 C50 50 150 50 190 150" fill="none" stroke="gray"/>
  <circle r="5">
    <animateMotion dur="5s" path="M10 10 L190 10 L190 190"/>
  </circle>
  <circle r="5">
    <animateMotion dur="5s" path="M10 10 L190 10" rotate="auto"/>
  </circle>
  <circle r="5">
    <animateMotion dur="5s" path="M10 10 L190 10" rotate="auto-reverse"/>
  </circle>
  <circle r="5">
    <animateMotion dur="5s" path="M10 10 L190 10" rotate="45"/>
  </circle>
  <circle r="5">
    <animateMotion dur="5s" from="0,0" to="100,50"/>
  </circle>
  <circle r="5">
    <animateMotion dur="5s" values="0,0;50,50;100,0" keyTimes="0;0.5;1"/>
  </circle>
  <circle r="5">
    <animateMotion dur="5s" path="M0 0 L100 0 L100 100" keyPoints="0;0.5;1" keyTimes="0;0.25;1" calcMode="linear"/>
  </circle>
  <circle r="5" fill="green">
    <animateMotion dur="5s"><mpath xlink:href="#track"/></animateMotion>
  </circle>
</svg>
